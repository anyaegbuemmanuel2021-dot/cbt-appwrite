<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <link rel="icon" type="image/x-icon" href="../favicon.ico">
  <link rel="icon" type="image/png" sizes="32x32" href="../favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="../favicon-16x16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="../apple-touch-icon.png">
  <title>Verify Certificate – SOFTLY DIGITAL V3</title>
  <link rel="stylesheet" href="../css/main.css">
  <link rel="stylesheet" href="../css/auth.css">
</head>
<body class="auth-body">
  <div class="auth-card" style="max-width:520px">
    <div class="auth-header">
      <div class="auth-icon">🔍</div>
      <h1>Certificate Verification</h1>
      <p>Verify the authenticity of a SOFTLY DIGITAL certificate</p>
    </div>
    <div id="verifyResult" style="display:none"></div>
    <div class="form-group">
      <label>Certificate Code</label>
      <input type="text" id="certCodeInput" placeholder="e.g. SD-ABC123-XY12"
        style="text-transform:uppercase;letter-spacing:2px;font-family:monospace;font-size:1.1rem">
    </div>
    <button class="auth-btn cand-btn" onclick="verifyCert()">🔍 Verify Certificate</button>
    <div class="auth-links" style="margin-top:20px">
      <a href="../index.html">← Back to Portal</a>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/appwrite@26.2.0/dist/iife/sdk.min.js"></script>
  <script src="../js/appwrite-config.js"></script>
  <script src="../js/certificate.js"></script>
  <script>
    // Auto-verify if code in URL
    document.addEventListener('DOMContentLoaded', () => {
      const code = new URLSearchParams(location.search).get('cert');
      if (code) { document.getElementById('certCodeInput').value = code; verifyCert(code); }
    });

    async function verifyCert(code) {
      const certCode = code || document.getElementById('certCodeInput').value.trim().toUpperCase();
      if (!certCode) { alert('Please enter a certificate code.'); return; }
      const el = document.getElementById('verifyResult');
      el.style.display = 'block';
      el.innerHTML = '<div class="loading-placeholder">Verifying…</div>';
      try {
        const res = await DB.list(SD.COL.CERTIFICATES, [SD.Q.equal('verifyCode', certCode)], 1);
        if (!res.total) {
          el.innerHTML = `<div class="alert alert-danger">❌ Certificate NOT found. This certificate may be invalid or forged.</div>`;
          return;
        }
        const c      = res.documents[0];
        const issued = c.issuedAt ? new Date(c.issuedAt).toLocaleDateString('en-NG',{dateStyle:'long'}) : '—';
        el.innerHTML = `
          <div class="alert alert-success" style="display:flex!important;flex-direction:column;gap:10px">
            <div style="font-size:1.5rem;font-weight:900;color:#28a745">✅ VALID CERTIFICATE</div>
            <div style="display:grid;grid-template-columns:auto 1fr;gap:8px 16px;font-size:.9rem">
              <strong>Candidate:</strong><span>${c.candidateName || '—'}</span>
              <strong>Exam:</strong><span>${c.examName || '—'}</span>
              <strong>Score:</strong><span>${c.score || 0}%</span>
              <strong>Grade:</strong><span>${c.grade || '—'}</span>
              <strong>Issued:</strong><span>${issued}</span>
              <strong>Code:</strong><span style="font-family:monospace">${certCode}</span>
            </div>
            ${c.pdfUrl ? `<a href="${c.pdfUrl}" target="_blank" class="btn-primary" style="text-decoration:none;display:inline-flex;width:fit-content">📜 View Certificate</a>` : ''}
          </div>`;
      } catch(e) {
        el.innerHTML = `<div class="alert alert-danger">Error: ${e.message}</div>`;
      }
    }
  </script>
</body>
</html>
