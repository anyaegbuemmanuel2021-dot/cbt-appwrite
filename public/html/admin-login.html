<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login – SOFTLY DIGITAL V3</title>
  <link rel="stylesheet" href="../css/main.css">
  <link rel="stylesheet" href="../css/auth.css">
</head>
<body class="auth-body">
  <a href="../index.html" class="back-link">← Back to Portal</a>

  <div class="auth-card" id="adminLoginCard">
    <div class="auth-header admin-hdr">
      <div class="auth-icon">⚙️</div>
      <h1>Administrator Login</h1>
      <p>Secure access for platform administrators</p>
    </div>
    <form id="adminForm" novalidate>
      <div class="form-group">
        <label>Email Address</label>
        <input type="email" id="adminEmail" placeholder="admin@softlydigital.com" required autocomplete="username">
      </div>
      <div class="form-group">
        <label>Password</label>
        <div class="pw-wrap">
          <input type="password" id="password" placeholder="Enter your password" required autocomplete="current-password">
          <button type="button" class="pw-toggle" onclick="togglePw('password')" aria-label="Show/hide password">👁</button>
        </div>
      </div>
      <div class="alert alert-danger" id="loginErr" style="display:none"></div>
      <button type="submit" class="auth-btn admin-btn" id="loginBtn">
        <span class="btn-text">Login to Admin Panel</span>
        <span class="btn-loader" style="display:none">⏳ Authenticating…</span>
      </button>
      <div class="auth-links">
        <a href="forgot-password.html">Forgot Password?</a>
        <span>|</span><a href="../index.html">Back to Portal</a>
      </div>
    </form>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/appwrite@16.0.0/dist/iife/sdk.min.js"></script>
  <script src="../js/appwrite-config.js"></script>
  <script src="../js/auth.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      document.getElementById('adminForm').addEventListener('submit', e => {
        e.preventDefault();
        AuthManager.adminLogin();
      });
    });
  </script>
</body>
</html>
