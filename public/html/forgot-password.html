<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password – SOFTLY DIGITAL V3</title>
  <link rel="stylesheet" href="../css/main.css">
  <link rel="stylesheet" href="../css/auth.css">
</head>
<body class="auth-body">
  <a href="../index.html" class="back-link">← Back to Portal</a>
  <div class="auth-card">
    <div class="auth-header">
      <div class="auth-icon">🔑</div>
      <h1>Reset Password</h1>
      <p>Enter your email address to receive a reset link</p>
    </div>
    <form id="fpForm" novalidate>
      <div class="form-group">
        <label>Email Address</label>
        <input type="email" id="fpEmail" placeholder="your@email.com" required autocomplete="email">
      </div>
      <div class="alert alert-danger"  id="fpErr"     style="display:none"></div>
      <div class="alert alert-success" id="fpSuccess" style="display:none">
        ✅ Reset link sent! Check your email inbox.
      </div>
      <button type="submit" class="auth-btn cand-btn" id="fpBtn">
        <span class="btn-text">Send Reset Link</span>
        <span class="btn-loader" style="display:none">⏳ Sending…</span>
      </button>
      <div class="auth-links">
        <a href="admin-login.html">Admin Login</a>
        <span>|</span>
        <a href="candidate-login.html">Candidate Login</a>
      </div>
    </form>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/appwrite@26.2.0/dist/iife/sdk.min.js"></script>
  <script src="../js/appwrite-config.js"></script>
  <script src="../js/auth.js"></script>
  <script>
    document.getElementById('fpForm').addEventListener('submit', async e => {
      e.preventDefault();
      const email = document.getElementById('fpEmail').value.trim();
      const errEl = document.getElementById('fpErr');
      const okEl  = document.getElementById('fpSuccess');
      const btn   = document.getElementById('fpBtn');
      errEl.style.display = 'none'; okEl.style.display = 'none';
      if (!email) { errEl.textContent = 'Please enter your email.'; errEl.style.display = 'block'; return; }
      btn.querySelector('.btn-text').style.display = 'none';
      btn.querySelector('.btn-loader').style.display = '';
      btn.disabled = true;
      try {
        await AUTH.resetPassword(email);
        okEl.style.display = 'block';
      } catch(err) {
        errEl.textContent = friendlyError(err);
        errEl.style.display = 'block';
      } finally {
        btn.querySelector('.btn-text').style.display = '';
        btn.querySelector('.btn-loader').style.display = 'none';
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
